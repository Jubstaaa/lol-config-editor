[package]
name = "lol-config-editor"
version = "2.0.0"
description = "Edit and switch League of Legends settings without launching the game"
authors = ["İlker Balcılar"]
edition = "2021"

[lib]
name = "lol_config_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
