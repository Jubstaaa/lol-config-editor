name: windows test build

# A Windows exe of any branch, for trying a change on a real League install
# before it ships. Nothing is published: the exe is a workflow artifact, built
# without the installer or the updater signature.
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          key: windows
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run tauri build --no-bundle
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lol-config-editor-windows-${{ github.sha }}
          path: app/src-tauri/target/release/*.exe
          if-no-files-found: error
          retention-days: 7
