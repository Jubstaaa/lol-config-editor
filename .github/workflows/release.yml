name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: draft release (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            args: --bundles nsis
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
        working-directory: app
      - name: Stamp the version from the tag
        run: bun run scripts/set-version.ts "${{ github.ref_name }}"
      # Both jobs write into one draft release, so the updater manifest ends up
      # listing every platform rather than whichever job finished last.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: LoL Config Editor ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
        # To sign and notarise the macOS build, add the Apple secrets here:
        # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
        # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID. They cannot sit here empty
        # waiting for the day — Tauri reads an empty APPLE_CERTIFICATE as a real
        # one and fails the build trying to import it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update package with the project's own key, which is what
          # lets the app install an update in place. Nothing to do with Apple.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
